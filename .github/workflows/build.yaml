name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'corretto'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++ binutils curl tar python3

      - name: Build
        run: bash ./build.sh

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tidesdb-java-unified-linux-x86_64
          path: dist/
          retention-days: 7
